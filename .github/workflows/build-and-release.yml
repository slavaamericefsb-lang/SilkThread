name: Build & Release SilkThread

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Display .NET SDK Version
        run: dotnet --version

      - name: Restore Dependencies
        run: dotnet restore SilkThread.slnx

      - name: Run Unit Tests
        run: dotnet test tests/SilkThread.Tests/SilkThread.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Publish SilkThread.App (WinUI 3 Standalone)
        run: |
          dotnet publish src/SilkThread.App/SilkThread.App.csproj -c Release -r win-x64 --self-contained true -o ./dist/SilkThread

      - name: Package Lightweight Patch (SilkThread_Patch.zip)
        shell: pwsh
        run: |
          $distDir = "./dist"
          $appDistDir = "$distDir/SilkThread"
          $patchZip = "$distDir/SilkThread_Patch.zip"
          if (Test-Path $patchZip) { Remove-Item $patchZip -Force }
          $patchStagingDir = "$distDir/patch_staging"
          if (Test-Path $patchStagingDir) { Remove-Item $patchStagingDir -Recurse -Force }
          New-Item -ItemType Directory -Path $patchStagingDir -Force | Out-Null
          
          $patchItems = Get-ChildItem -Path $appDistDir -Recurse | Where-Object {
              -not $_.PSIsContainer -and
              -not ($_.Extension -eq ".pdb") -and
              ($_.Name -like "SilkThread.*" -or $_.Name -like "*.pri" -or $_.Name -like "*.xbf" -or $_.Name -like "workloads*.json" -or $_.FullName -like "*\Assets\*")
          }
          $appDistPath = (Resolve-Path $appDistDir).Path
          foreach ($item in $patchItems) {
              $relative = $item.FullName.Substring($appDistPath.Length).TrimStart('\', '/')
              $targetPath = Join-Path $patchStagingDir $relative
              $targetParent = Split-Path $targetPath
              if (-not (Test-Path $targetParent)) {
                  New-Item -ItemType Directory -Path $targetParent -Force | Out-Null
              }
              Copy-Item $item.FullName $targetPath -Force
          }
          [System.IO.Compression.ZipFile]::CreateFromDirectory($patchStagingDir, $patchZip, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Remove-Item $patchStagingDir -Recurse -Force
          $patchSize = (Get-Item $patchZip).Length / 1MB
          Write-Host "Lightweight patch created: [$(Get-Item $patchZip).FullName] ($("{0:N2}" -f $patchSize) MB)"

      - name: Package Installer Payload
        shell: pwsh
        run: |
          $payloadDir = "src/SilkThread.Installer/Payload"
          if (!(Test-Path $payloadDir)) { New-Item -ItemType Directory -Path $payloadDir -Force }
          $zipPath = "$payloadDir/installer_payload.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Write-Host "Creating $zipPath from ./dist/SilkThread..."
          [System.IO.Compression.ZipFile]::CreateFromDirectory("./dist/SilkThread", $zipPath, [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $zipSize = (Get-Item $zipPath).Length / 1MB
          Write-Host "Payload created: [$(Get-Item $zipPath).FullName] ($("{0:N2}" -f $zipSize) MB)"

      - name: Build Installer (SilkThread_Setup.exe)
        run: |
          dotnet publish src/SilkThread.Installer/SilkThread.Installer.csproj -c Release -r win-x64 --self-contained true -o ./dist/installer_build
          Copy-Item ./dist/installer_build/SilkThread_Setup.exe ./dist/SilkThread_Setup.exe -Force

      - name: Generate Checksums & Update Manifest
        shell: pwsh
        run: |
          $setupExe = "./dist/SilkThread_Setup.exe"
          $patchZip = "./dist/SilkThread_Patch.zip"
          $hash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash
          $checksumContent = "$hash  SilkThread_Setup.exe"
          if (Test-Path $patchZip) {
              $patchHash = (Get-FileHash -Path $patchZip -Algorithm SHA256).Hash
              $checksumContent += "`r`n$patchHash  SilkThread_Patch.zip"
          }
          $checksumContent | Out-File -FilePath "./dist/SHA256SUMS.txt" -Encoding ascii
          Write-Host "SHA256SUMS.txt content:`n$checksumContent"
          
          # Verify version.json exists
          if (Test-Path "./version.json") {
              Get-Content "./version.json"
          }

      - name: Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: SilkThread ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          files: |
            dist/SilkThread_Setup.exe
            dist/SilkThread_Patch.zip
            dist/SHA256SUMS.txt
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
